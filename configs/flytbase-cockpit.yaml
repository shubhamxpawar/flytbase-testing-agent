# Verified 2026-09-26 against the active `npm run dev` cockpit instance.
# HTTP evidence: GET http://localhost:5173 -> 200 text/html.
target_id: flytbase-cockpit-node-dev
base_url: http://localhost:5173

# Verified by GET http://localhost:4000/api/health -> 200 JSON and backend routes.
control_api_base_url: http://localhost:4000/api

# This is Socket.IO on the root namespace, not a raw WebSocket endpoint.
# CockpitPage calls socketClient.connect(config.apiUrl, config.orgId).
websocket_url: http://localhost:4000
socket_transport: socket.io
socket_namespace: /
socket_org_id: flytbase

# Active frontend config.js exposes this WHEP base URL; stream identity is the
# `video.url` payload for the selected drone. The player has data-testid=video-player.
whep_base_url: http://localhost:8889
video_player_testid: video-player
video_stream_payload_path: video.url

# Cesium receives the telemetry longitude/latitude directly. The application
# declares no tolerance, so require exact logical coordinates rather than invent one.
map_position_epsilon_m: 0

# CesiumMap defines STALE_AFTER_MS = 5000.
freshness_threshold_s: 5
